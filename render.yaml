services:
  - type: web
    name: straitgate
    runtime: node
    buildCommand: npm ci
    startCommand: node server.js
    envVars:
      - key: NEON_AUTH_BASE_URL
        value: https://ep-old-sea-zaqa3i6p.neonauth.c-2.eu-west-2.aws.neon.tech/neondb/auth
      - key: PUBLIC_ORIGIN
        value: https://straitgate.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
