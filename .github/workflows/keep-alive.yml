name: Render Keep-Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --max-time 30 \
            -H "Cache-Control: no-store" \
            "https://straitgate.onrender.com/health?signal=$(uuidgen)"
