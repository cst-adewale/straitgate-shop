<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Your shopping cart | Straitgate</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/straitgate-theme.css">
<script src="/straitgate-theme.js"></script>
<style>
:root{--ink:#0a0a0a;--lime:#ccf97c;--tile:#f5f5f5;--mute:#777;--line:#dedede;--site-font:"Inter",Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--site-font);background:#fff}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.page{max-width:1280px;min-height:100vh;margin:auto;padding:clamp(20px,5vw,64px)}
.cart-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}.logo{font-size:24px;letter-spacing:-.05em}.cart-nav{display:flex;align-items:center;gap:24px;font-size:12px}.cart-nav .cart-link{background:var(--lime);border-radius:999px;padding:10px 16px}.cart-count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:4px;border-radius:50%;background:#fff;font-size:10px}.cart-list-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px}
h1{font-size:clamp(34px,5vw,56px);font-weight:400;letter-spacing:-.055em;margin:clamp(36px,6vw,64px) 0 8px}.intro{color:var(--mute);font-size:13px;margin:0 0 26px}.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,360px);gap:24px;align-items:start}.cart-items,.summary{background:#fff;border:1px solid var(--line);border-radius:14px}.cart-items{padding:clamp(16px,3vw,28px)}.cart-item{display:grid;grid-template-columns:132px minmax(0,1fr) auto;gap:20px;padding:20px 0;border-bottom:1px solid var(--line);align-items:center}.cart-item:first-child{padding-top:0}.cart-item:last-child{border-bottom:0;padding-bottom:0}.item-image{width:132px;height:112px;background:var(--tile);border-radius:10px;display:grid;place-items:center;overflow:hidden}.item-image img{width:100%;height:100%;object-fit:cover}.item-placeholder{font-size:36px;color:var(--mute)}.item-name{font-size:16px;font-weight:500;margin:0 0 7px}.item-category,.item-unit{font-size:12px;color:var(--mute);margin:0 0 7px}.item-tools{display:flex;align-items:center;gap:18px;margin-top:16px}.quantity{display:flex;align-items:center;border:1px solid var(--line);border-radius:999px;overflow:hidden}.quantity button{width:34px;height:32px;border:0;background:#fff;font-size:17px}.quantity span{min-width:32px;text-align:center;font-size:12px}.remove-item{border:0;background:transparent;color:#666;text-decoration:underline;font-size:11px;padding:8px 0}.line-price{text-align:right;font-weight:500;white-space:nowrap}.summary{padding:24px;position:sticky;top:20px}.summary h2{font-size:18px;font-weight:500;margin:0 0 20px}.summary-row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:13px}.summary-row.muted{color:var(--mute)}.summary-row.total{border:0;font-size:17px;font-weight:600;padding-top:18px}.checkout-note{background:var(--tile);border-radius:9px;padding:14px;font-size:11px;line-height:1.5;color:#555;margin:8px 0 16px}.continue-link,.empty-link{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:999px;background:var(--lime);font-size:12px;font-weight:500}.cart-empty{padding:60px 20px;text-align:center}.cart-empty h2{font-size:24px;font-weight:400;margin:0 0 8px}.cart-empty p{font-size:13px;color:var(--mute);margin:0 0 24px}.cart-error{padding:18px;background:#fff1ef;color:#8c231a;border-radius:8px;font-size:13px}
.cart-list-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--line);font-size:12px}.select-all{display:flex;align-items:center;gap:9px;cursor:pointer}.select-circle{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:0;border:1.5px solid #999;border-radius:50%;background:#fff;display:inline-grid;place-items:center;cursor:pointer;flex:none}.select-circle:checked{background:var(--lime);border-color:var(--ink)}.select-circle:checked::after{content:"✓";font-size:12px;font-weight:700;color:var(--ink)}.select-circle:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.cart-item{grid-template-columns:24px 132px minmax(0,1fr) auto!important;gap:16px!important}.cart-item:first-child{padding-top:20px!important}
@media(max-width:800px){.cart-layout{grid-template-columns:1fr}.summary{position:static;grid-row:1}.cart-item{grid-template-columns:24px 100px minmax(0,1fr) auto!important;gap:12px!important}.item-image{width:100px;height:96px}}
@media(max-width:520px){.page{padding:18px}.cart-head{align-items:flex-start}.cart-nav{gap:12px;font-size:11px}.cart-item{grid-template-columns:22px 82px minmax(0,1fr)!important;gap:10px!important}.item-image{width:82px;height:88px;grid-row:span 2}.line-price{grid-column:3;text-align:left}.item-name{font-size:14px}.item-tools{gap:14px;margin-top:10px}.summary{padding:18px}}
</style>
</head>
<body>
<div class="page">
 <header class="cart-head"><a class="logo" href="/straitgate-home.html">Straitgate</a><nav class="cart-nav" aria-label="Shop navigation"><a href="/straitgate-catalog.html">Continue shopping</a><a class="cart-link" href="/straitgate-cart.html" aria-current="page">Cart <span class="cart-count" id="cartCount">0</span></a></nav></header>
 <main><h1>Your cart <span id="cartTitleCount"></span></h1><p class="intro">Review your items and quantities.</p><div id="cartContent" aria-live="polite"></div></main>
</div>
<script src="/straitgate-cart.js"></script>
</body>
</html>
