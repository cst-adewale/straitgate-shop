<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Reset admin password | Straitgate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:"Inter Tight",Arial,sans-serif;font-size:14px}
main{width:min(100% - 32px,420px);padding:clamp(22px,4vw,36px);border-radius:22px;background:var(--tile)}
h1{font-size:clamp(30px,5vw,42px);font-weight:400;letter-spacing:-.05em;margin:0 0 12px}
p{line-height:1.5;color:var(--mute)}label{display:block;margin:18px 0 6px}
input{width:100%;height:40px;padding:0 14px;border:1px solid var(--field-line);border-radius:999px;background:var(--field);color:var(--ink);font:inherit}
button[type=submit]{margin-top:22px;height:40px;padding:0 22px;border:0;border-radius:999px;background:var(--lime);color:#0a0a0a;font:inherit;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}a{color:var(--ink)}
</style>
<link rel="stylesheet" href="/straitgate-theme.css">
<script src="/straitgate-theme.js"></script>
</head>
<body>
<button class="theme-toggle theme-floating" type="button" aria-label="Switch to dark mode" title="Dark mode">☾</button>
<main>
<h1>Set your password</h1>
<p>Choose a unique password with at least 12 characters.</p>
<form id="reset-form">
<label for="password">New password</label><input id="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<label for="confirm">Confirm password</label><input id="confirm" type="password" minlength="12" maxlength="128" autocomplete="new-password" required>
<button type="submit">Set password</button>
</form>
<p id="status" role="status"></p>
<p><a href="/straitgate-admin-login.html">Back to sign in</a></p>
</main>
<script>
const params = new URLSearchParams(location.search);
const token = params.get('token');
history.replaceState(null, '', location.pathname);
const form = document.getElementById('reset-form');
const status = document.getElementById('status');
if (!token || params.has('error')) { form.hidden = true; status.textContent = 'This reset link is invalid or expired. Request a new one from the sign-in page.'; }
form.addEventListener('submit', async event => {
  event.preventDefault();
  const password = document.getElementById('password').value;
  if (password !== document.getElementById('confirm').value) { status.textContent = 'The passwords do not match.'; return; }
  const button = form.querySelector('button');
  button.disabled = true;
  status.textContent = 'Setting your password…';
  try {
    const response = await fetch('/api/admin/reset-password', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:password})});
    const data = await response.json();
    if (!response.ok) { status.textContent = data.error || 'Reset failed. Request a new link.'; return; }
    form.hidden = true;
    status.textContent = 'Password set. You can now sign in.';
  } catch { status.textContent = 'Could not reach the reset service.'; }
  finally { button.disabled = false; }
});
</script>
</body>
</html>
