<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Saved products | Straitgate</title>
<meta name="robots" content="noindex,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/straitgate-theme.css">
<script src="/straitgate-theme.js"></script>
<style>
:root{--ink:#0a0a0a;--lime:#ccf97c;--tile:#f5f5f5;--mute:#777;--line:#dedede;--site-font:"Inter",Arial,sans-serif}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:var(--site-font);background:#fff}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}.page{max-width:1280px;min-height:100vh;margin:auto;padding:clamp(20px,5vw,64px)}.wishlist-head{display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;border-bottom:1px solid var(--line)}.logo{font-size:24px;letter-spacing:-.05em}.wishlist-nav{display:flex;align-items:center;gap:22px;font-size:12px}.wishlist-nav a:last-child{background:var(--lime);border-radius:999px;padding:10px 16px}.cart-count{display:inline-grid;place-items:center;min-width:20px;height:20px;margin-left:4px;border-radius:50%;background:#fff;font-size:10px}h1{font-size:clamp(34px,5vw,56px);font-weight:400;letter-spacing:-.055em;margin:clamp(36px,6vw,64px) 0 8px}.intro{color:var(--mute);font-size:13px;margin:0 0 26px}.wishlist-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:22px}.wish-card{border:1px solid var(--line);border-radius:13px;overflow:hidden;background:#fff}.wish-image{display:grid;place-items:center;height:220px;background:var(--tile);overflow:hidden}.wish-image img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:56px;color:var(--mute)}.wish-info{padding:16px}.wish-info h2{font-size:16px;font-weight:500;margin:0 0 7px}.wish-info p{font-size:12px;color:var(--mute);margin:0 0 8px}.wish-price{font-weight:500;color:var(--ink)!important}.wish-actions{display:flex;gap:9px;margin-top:16px}.wish-actions button,.wish-actions a{display:flex;align-items:center;justify-content:center;flex:1;min-height:38px;border-radius:999px;font-size:11px}.add-cart{border:0;background:var(--lime)}.view-product{border:1px solid var(--line)}.remove-wish{border:0;background:none;color:var(--mute);text-decoration:underline;font-size:11px;margin-top:10px;padding:7px 0}.empty{padding:64px 20px;text-align:center;background:var(--tile);border-radius:12px}.empty h2{font-size:23px;font-weight:400;margin:0 0 8px}.empty p{font-size:13px;color:var(--mute);margin:0 0 20px}.browse{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 22px;border-radius:999px;background:var(--lime);font-size:12px}.status{padding:20px;background:var(--tile);border-radius:10px;font-size:13px;color:var(--mute)}@media(max-width:520px){.page{padding:18px}.wishlist-head{align-items:flex-start}.wishlist-nav{gap:12px;font-size:11px}.wish-image{height:180px}.wishlist-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wish-info{padding:12px}.wish-actions{flex-direction:column}}
</style>
</head>
<body><div class="page"><header class="wishlist-head"><a class="logo" href="/straitgate-home.html">Straitgate</a><nav class="wishlist-nav" aria-label="Shop navigation"><a href="/straitgate-catalog.html">Continue shopping</a><a href="/straitgate-cart.html">Cart <span class="cart-count" id="cartCount">0</span></a></nav></header><main><h1>Saved products <span id="wishlistCount"></span></h1><p class="intro">Products you’ve added to your wishlist are saved in this browser.</p><div id="wishlistContent" aria-live="polite"><p class="status">Loading saved products…</p></div></main></div><script src="/straitgate-wishlist.js"></script></body>
</html>
