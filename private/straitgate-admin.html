<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Straitgate – Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Design-guide tokens (light defaults) ── */
:root{
  --bg:#161616; --surface:#ffffff; --tile:#f5f5f5; --ink:#0a0a0a; --mute:#8a8a8a;
  --line:#dddddd; --field:#ffffff; --field-line:#9a9a9a;
  --lime:#ccf97c; --on-lime:#0a0a0a; --hover:#0a0a0a; --on-hover:#ffffff;
  --red:#e5271d; --yel:#f5c20f; --blu:#1f5fe0; --ok:#2e7d12;
  --pill:#e8e8e8; --pill-warn:#ffe4a3; --pill-bad:#ffc9c4;
  --fs-xs:10px; --fs-sm:11px; --fs-md:12px; --fs-base:13px;
  --h-sm:28px; --h-md:34px; --h-lg:40px;
  --r-pill:999px; --r-sm:8px; --r-md:12px; --r-lg:22px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
/* Dark mode token overrides */
:root[data-theme="dark"]{
  --bg:#0b0b0b; --surface:#161616; --tile:#202020; --ink:#f2f2f2; --mute:#8f8f8f;
  --line:#2f2f2f; --field:#1d1d1d; --field-line:#4a4a4a;
  --lime:#ccf97c; --on-lime:#0a0a0a; --hover:#f2f2f2; --on-hover:#0a0a0a;
  --red:#ff5a4d; --yel:#f5c20f; --blu:#5b8cff; --ok:#8fd45a;
  --pill:#2c2c2c; --pill-warn:#4a3d12; --pill-bad:#4d1f1b;
  color-scheme:dark;
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b0b0b; --surface:#161616; --tile:#202020; --ink:#f2f2f2; --mute:#8f8f8f;
    --line:#2f2f2f; --field:#1d1d1d; --field-line:#4a4a4a;
    --lime:#ccf97c; --on-lime:#0a0a0a; --hover:#f2f2f2; --on-hover:#0a0a0a;
    --red:#ff5a4d; --yel:#f5c20f; --blu:#5b8cff; --ok:#8fd45a;
    --pill:#2c2c2c; --pill-warn:#4a3d12; --pill-bad:#4d1f1b;
    color-scheme:dark;
  }
}

*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--surface);color:var(--ink);font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;padding:0;-webkit-font-smoothing:antialiased;font-size:var(--fs-base);overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}

/* ── Page layout ── */
.page{min-height:100vh;width:100%;margin:0;background:var(--surface);border-radius:0;padding:clamp(20px,4.5vw,64px) clamp(20px,5.8vw,72px) clamp(24px,4vw,56px)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:clamp(20px,2.4vw,26px);font-weight:500;letter-spacing:-.04em}
.logo small{font-size:var(--fs-sm);color:var(--mute);letter-spacing:0;margin-left:8px;font-weight:400}
.who{font-size:var(--fs-sm);color:var(--mute)}
h1{font-weight:400;font-size:clamp(44px,8vw,96px);letter-spacing:-.055em;line-height:1;margin:clamp(26px,4.5vw,56px) 0 clamp(16px,2.4vw,26px)}
h2{font-weight:400;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.03em;margin:0 0 14px}
h3{font-weight:500;font-size:var(--fs-base);margin:0 0 10px}

/* ── Tabs / chip bar ── */
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:clamp(18px,2.6vw,30px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}

/* ── Buttons & chips ── */
.chip,.btn{border:1px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:var(--r-pill);height:var(--h-md);padding:0 clamp(14px,2vw,24px);font-size:var(--fs-sm);white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s,border-color .2s}
.chip[aria-pressed=true],.btn.l{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.btn:hover,.chip:hover{background:var(--hover);color:var(--on-hover);border-color:var(--hover)}
.btn.l:hover{background:var(--hover);color:var(--on-hover);border-color:var(--hover)}
.btn.sm{height:var(--h-sm);padding:0 12px;font-size:var(--fs-xs)}
.btn.x{border-color:var(--line);color:var(--mute);background:transparent}
.btn.x:hover{background:var(--hover);color:var(--on-hover);border-color:var(--hover)}

/* ── Grid system ── */
.grid{display:grid;gap:clamp(12px,2vw,24px)}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}.gf{grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}

/* ── Tiles ── */
.tile{background:var(--tile);border-radius:var(--r-md);padding:clamp(14px,1.8vw,22px);min-width:0}
.browse-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(190px,100%),1fr));gap:12px}.browse-card{display:flex;flex-direction:column;gap:6px;padding:14px;position:relative}.browse-card[hidden]{display:none}.browse-card h3,.browse-card p{margin:0}.browse-card .card-link{position:absolute;inset:0;z-index:1;border-radius:inherit}.browse-card .card-link:focus-visible{outline:2px solid var(--lime);outline-offset:2px}.browse-card button,.browse-card input{position:relative;z-index:2}.browse-image{width:100%;aspect-ratio:1.6;max-height:145px;object-fit:cover;border-radius:10px;background:#e9e9e9}.browse-placeholder{display:grid;place-items:center;font-size:36px;color:var(--mute)}.browse-card .bar{margin-top:auto;margin-bottom:0;gap:6px}.browse-card .btn{padding:0 10px}
.detail-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail-gallery>a:first-child{grid-column:1/-1}.detail-gallery img{display:block;width:100%;max-height:420px;aspect-ratio:1.4;object-fit:contain;border-radius:var(--r-sm);background:var(--surface)}.detail-row{display:flex;justify-content:space-between;gap:16px;padding:10px 0;border-bottom:1px solid var(--line)}.detail-row span{color:var(--mute)}.detail-row strong{text-align:right;font-weight:500;overflow-wrap:anywhere}

/* ── KPI cards ── */
.kpi .v{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.05em;line-height:1;margin-top:10px;overflow-wrap:anywhere}
.kpi .l{font-size:var(--fs-sm);color:var(--mute)}
.kpi .d{font-size:var(--fs-xs);margin-top:8px}
.up{color:var(--ok)}.dn{color:var(--red)}

/* ── Notes ── */
.note{font-size:var(--fs-xs);color:var(--mute);margin:10px 0 0}

/* ── Charts ── */
svg.ch{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:var(--fs-xs);margin-top:10px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}

/* ── Forms ── */
label{display:block;font-size:var(--fs-xs);color:var(--mute);margin:0 0 5px}
input,select,textarea{width:100%;height:var(--h-md);border:1px solid var(--field-line);border-radius:var(--r-pill);padding:0 14px;font:inherit;font-size:var(--fs-md);background:var(--field);color:var(--ink)}
select{appearance:none;-webkit-appearance:none;border-radius:var(--r-pill);padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat}
input::placeholder,textarea::placeholder{color:var(--mute)}
textarea{height:70px;border-radius:var(--r-md);padding:10px 14px;resize:vertical}
input[type=file]{padding:6px 14px;height:auto;border-radius:var(--r-sm)}
.f{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.f>*{min-width:0}.f .w{grid-column:1/-1}

/* ── Tables ── */
.tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
.usage-return{display:flex;align-items:center;gap:6px;white-space:nowrap}.usage-return input{width:158px;min-width:0;flex:0 0 158px;padding:0 8px}.usage-return .btn{flex:none}
table{width:100%;border-collapse:collapse;font-size:var(--fs-md)}
th{font-weight:400;color:var(--mute);font-size:var(--fs-xs);text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}

/* ── Status pills ── */
.pill{display:inline-block;border-radius:var(--r-pill);padding:2px 10px;font-size:var(--fs-xs);background:var(--pill);color:var(--ink)}
.pill.ok{background:var(--lime);color:var(--on-lime)}
.pill.warn{background:var(--pill-warn)}
.pill.bad{background:var(--pill-bad)}

/* ── Budget panel ── */
.budget-panel{margin:0 0 clamp(18px,2.6vw,30px)}
.budget-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.budget-metrics div{background:var(--tile);border-radius:var(--r-sm);padding:12px;border:1px solid var(--line)}
.budget-metrics b{display:block;font-size:clamp(17px,2.5vw,25px);font-weight:500;margin-top:4px;overflow-wrap:anywhere;color:var(--ink)}
.budget-rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.budget-rate label{margin:0}
.budget-rate input{width:100px}

/* ── Health panel ── */
.health-panel{margin:0 0 clamp(18px,2.6vw,30px)}
.health-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.health-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.health-metrics div{background:var(--tile);border-radius:var(--r-sm);padding:12px;border:1px solid var(--line)}
.health-metrics b{display:block;font-size:19px;font-weight:500;margin-top:4px;color:var(--ink)}
.health-chart{display:flex;align-items:end;gap:5px;height:75px;border-bottom:1px solid var(--line);padding-top:8px}
.health-chart span{flex:1;min-width:5px;border-radius:3px 3px 0 0;background:var(--lime)}
.health-chart span.bad{background:var(--red)}

/* ── Product thumbnails ── */
.thumb{width:44px;height:44px;border-radius:var(--r-sm);background:var(--tile);border:1px solid var(--line);object-fit:cover;display:grid;place-items:center;font-size:14px;color:var(--mute);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pr{display:flex;align-items:center;gap:12px}

/* ── Bars ── */
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{width:auto;min-width:150px}
.sp{margin-left:auto}

/* ── Inventory filter bar ── */
.inv-filters{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.inv-chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.inv-controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inv-controls input[type=search]{flex:2;min-width:180px}
.inv-controls select{flex:1;min-width:140px;width:auto}
.inv-controls input#ibfilter{flex:1.5;min-width:170px}

/* ── Quotation line items ── */
.qi{display:grid;grid-template-columns:minmax(0,1fr) 70px 100px 28px;gap:8px;margin-bottom:8px;align-items:center}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:var(--fs-md)}
.sum .t{border-top:1px solid var(--ink);margin-top:6px;padding-top:12px;font-size:20px;letter-spacing:-.03em}

/* ── Converter / calculator ── */
.res{font-size:clamp(26px,3vw,36px);letter-spacing:-.04em;margin:12px 0 0;color:var(--ink)}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.calc{max-width:320px}
.disp{background:var(--ink);color:var(--surface);border-radius:var(--r-md);padding:14px 16px;text-align:right;font-size:30px;letter-spacing:-.03em;min-height:64px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.disp small{font-size:var(--fs-sm);color:var(--mute);min-height:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keys button{height:46px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);font-size:16px;color:var(--ink)}
.keys button:hover{background:var(--tile)}
.keys .o{background:var(--lime);color:var(--on-lime);border-color:var(--lime)}
.keys .o:hover{background:var(--hover);color:var(--on-hover);border-color:var(--hover)}
.keys .z{grid-column:span 2}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--surface);padding:10px 20px;border-radius:var(--r-pill);font-size:var(--fs-md);opacity:0;pointer-events:none;transition:.3s;z-index:9}
.upload-overlay{position:fixed;inset:0;z-index:20;background:#0009;display:grid;place-items:center;padding:20px}.upload-overlay[hidden]{display:none}.upload-progress{background:var(--surface);color:var(--ink);border-radius:var(--r-md);padding:28px;min-width:min(320px,100%);display:flex;align-items:center;gap:16px;box-shadow:0 16px 48px #0003}.upload-spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--ink);border-radius:50%;animation:upload-spin .8s linear infinite;flex:none}@keyframes upload-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.upload-spinner{animation:none}}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ── Misc ── */
.empty{color:var(--mute);padding:20px 0;font-size:var(--fs-md)}
footer{border-top:1px solid var(--line)}
#pa{display:none}

/* ── Print ── */
@page{size:A4;margin:0}
@media print{html,body{margin:0;background:#fff;padding:0}.page,.toast{display:none!important}#pa{display:block;padding:0;font-size:var(--fs-md);print-color-adjust:exact;-webkit-print-color-adjust:exact}#pa table{font-size:var(--fs-md)}}

/* ── Responsive breakpoints ── */
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.gf{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media(max-width:620px){
  .g2,.g3,.f{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}
  .qi{grid-template-columns:1fr 56px 80px 28px}.sp{margin-left:0}
  .bar input,.bar select{min-width:0;flex:1}
  .health-metrics{grid-template-columns:1fr 1fr}
  .budget-metrics{grid-template-columns:1fr}
  .page{padding:20px 14px 32px}
  header{align-items:flex-start}
  .logo small{display:block;margin:2px 0 0}
  .who{order:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}
  .theme-toggle{margin-left:auto}
  h1{font-size:clamp(40px,12vw,64px);margin:28px 0 18px}
  #tabs{margin-left:-14px;margin-right:-14px;padding:0 14px 8px;scrollbar-width:auto;scroll-snap-type:x proximity}
  #tabs .chip{scroll-snap-align:start}
  .tile{padding:16px}
  .tw table:has(thead){min-width:560px}
  .bar{align-items:stretch}
  .bar input,.bar select{width:100%;flex-basis:100%}
  .bar .btn{justify-content:center}
  .qi{grid-template-columns:minmax(0,1fr) 52px 72px 28px;gap:5px}
  .qi input{min-width:0;padding:0 7px}
  .detail-row{flex-direction:column;gap:3px}.detail-row strong{text-align:left}
  .toast{width:max-content;max-width:calc(100vw - 28px);text-align:center}
}
@media(max-width:480px){
  .cv{grid-template-columns:1fr}
  .budget-rate{align-items:stretch}.budget-rate input{width:100%}
  .health-head .btn{width:100%;justify-content:center}
  .health-metrics{gap:8px}
  .health-metrics div,.budget-metrics div{padding:10px}
  .health-metrics b{font-size:16px}
  .disp{font-size:26px}
  .keys{gap:6px}.keys button{height:42px}
  .f{gap:10px}
}
@media(max-width:380px){
  .g4{grid-template-columns:1fr}
  .qi{grid-template-columns:minmax(0,1fr) 46px 64px 28px}
  .qi input{font-size:var(--fs-xs)}
  .who{font-size:var(--fs-xs)}
  .who .btn{padding:0 9px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

</style>
<link rel="stylesheet" href="/straitgate-theme.css">
<script src="/straitgate-theme.js"></script>
</head>
<body>
<div class="page">
<header><span class="logo">Straitgate<small>Admin</small></span><span class="who">Admin dashboard &middot; <span id="today"></span> &middot; <button id="logout" class="btn sm" type="button">Sign out</button></span><button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark mode">☾</button></header>
<h1 id="ttl">Dashboard</h1>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
<footer style="margin-top:clamp(48px,8vw,100px);padding-top:20px"><a href="/straitgate-home.html">Home</a> &nbsp;·&nbsp; <a href="/straitgate-catalog.html">Catalog</a> &nbsp;·&nbsp; <a href="/admin/products">Products page</a> &nbsp;·&nbsp; <a href="/admin/inventory">Inventory page</a></footer>
</div>
<div id="pa"></div>
<div class="toast" id="toast" role="status"></div>
<div class="upload-overlay" id="uploadOverlay" role="status" aria-live="polite" hidden><div class="upload-progress"><span class="upload-spinner" aria-hidden="true"></span><strong id="uploadStatus">Uploading product...</strong></div></div>

<script>
var TABS=[['dashboard','Dashboard'],['products','Products'],['inventory','Inventory'],['quotes','Quotations'],['budget','Budget'],['tools','Converter & calculator']];
var CATS=['Security door','Sliding gate','Pedestrian gate','Estate gate','Garden gate','Driveway gate','Accessory'];
var ITYPES=['Equipment','Tool','Product','Material'];
var DB={products:[],inv:[],quotes:[]};
var METRIC_PERIOD={traffic:'day',signups:'day',revenue:'day'};
function metricCard(kind,title,values){var period=METRIC_PERIOD[kind],value=values?.[period]||0;return '<div class="tile kpi"><div class="l">'+title+'</div><div class="v">'+(kind==='revenue'?gbp(value):value)+'</div><div class="d"><select data-metric-period="'+kind+'" aria-label="'+title+' date range" style="width:auto;min-width:110px"><option value="day"'+(period==='day'?' selected':'')+'>Daily</option><option value="week"'+(period==='week'?' selected':'')+'>Weekly</option><option value="month"'+(period==='month'?' selected':'')+'>Monthly</option></select></div></div>'}
var dataLoaded=false,dataIssue='';
var productSaving=false;
function uploadProgress(message,button){$('uploadStatus').textContent=message;$('uploadOverlay').hidden=false;if(button){button.disabled=true;button.textContent=message}}
function actionProgress(kind,action){if(kind==='quotes'&&action==='add')return 'Creating quotation...';if(kind==='settings'&&action==='letterhead')return 'Uploading letterhead...';if(action==='remove')return 'Removing item...';if(action==='setStock'||action==='adjust')return 'Saving stock...';if(action==='checkout')return 'Recording equipment use...';if(action==='return')return 'Recording return...';if(action==='status')return 'Updating quotation...';return 'Saving changes...'}
async function refresh(){var ownsOverlay=$('uploadOverlay').hidden===true;if(ownsOverlay)uploadProgress('Loading admin data...');try{var r=await fetch('/api/admin/data',{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not load dashboard data');if(!Array.isArray(data.products)||!Array.isArray(data.inv)||!Array.isArray(data.quotes))throw Error('Dashboard data is incomplete');DB=data;dataLoaded=true;dataIssue='';show();return true}catch(e){dataIssue=e.message||'Could not load dashboard data';show();return false}finally{if(ownsOverlay)$('uploadOverlay').hidden=true}}
async function change(kind,action,data){if(dataIssue){toast('Reconnect to the database before saving');return false}var ownsOverlay=$('uploadOverlay').hidden===true;if(ownsOverlay)uploadProgress(actionProgress(kind,action));try{var r=await fetch('/api/admin/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,action:action,data:data})});var result=await r.json();if(!r.ok)throw Error(result.error||'Could not save');DB=result;dataLoaded=true;show();return true}catch(e){toast(e.message);return false}finally{if(ownsOverlay)$('uploadOverlay').hidden=true}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gbp(n){return '₦'+(Math.round(n*100)/100).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
function nid(a){return a.reduce(function(m,x){return Math.max(m,x.id)},0)+1}
function totals(q){var sub=q.items.reduce(function(s,i){return s+i.q*i.p},0),d=sub*(q.disc||0)/100,net=sub-d+(+q.inst||0);return{sub:sub,d:d,inst:+q.inst||0,net:net,total:net}}

function art(t,c){var s='',i;if(t==='Security door')s='<rect x="56" y="14" width="128" height="176" rx="6" fill="#222"/><rect x="64" y="22" width="112" height="168" fill="'+c+'"/><rect x="146" y="92" width="10" height="26" rx="5" fill="#ddd"/>';else if(t==='Garden gate'){s='<path d="M50 192V84Q120 14 190 84V192" fill="none" stroke="'+c+'" stroke-width="10"/>';for(i=0;i<7;i++)s+='<rect x="'+(66+i*18)+'" y="90" width="6" height="100" fill="'+c+'"/>'}else if(t==='Driveway gate'){s='<rect x="14" y="40" width="10" height="150" fill="#222"/><rect x="34" y="52" width="160" height="14" fill="'+c+'"/><rect x="34" y="176" width="160" height="14" fill="'+c+'"/>';for(i=0;i<9;i++)s+='<rect x="'+(40+i*17)+'" y="66" width="6" height="110" fill="'+c+'"/>'}else s='<circle cx="120" cy="100" r="50" fill="'+c+'"/>';return '<svg viewBox="0 0 240 200" class="ch">'+s+'</svg>'}

/* charts */
function barChart(l,v,hi,caption){var m=Math.max(1,Math.max.apply(null,v)*1.15),w=400,h=190,bw=w/l.length,s='';
 [0,.5,1].forEach(function(f){var y=h-24-(h-40)*f;s+='<line x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>'});
 v.forEach(function(x,i){var bh=(h-40)*x/m,y=h-24-bh;s+='<rect x="'+(i*bw+bw*.18)+'" y="'+y+'" width="'+bw*.64+'" height="'+bh+'" rx="4" fill="'+(i===hi?'#ccf97c':'var(--ink)')+'"><title>'+l[i]+': '+(caption==='Revenue'?gbp(x):x)+'</title></rect><text x="'+(i*bw+bw/2)+'" y="'+(h-8)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+l[i]+'</text>'});
 return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+caption+' by month">'+s+'</svg>'}
function donut(d){var total=d.reduce(function(s,x){return s+x[1]},0);if(!total)return '<div class="empty">No confirmed payments recorded yet.</div>';var r=50,C=2*Math.PI*r,o=0,s='';
 d.forEach(function(x){var len=C*x[1]/total;s+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+x[2]+'" stroke-width="24" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 70 70)"><title>'+esc(x[0])+': '+gbp(x[1])+'</title></circle>';o+=len});
 return '<svg class="ch" viewBox="0 0 140 140" style="max-width:190px;margin:0 auto" role="img" aria-label="Revenue by product category">'+s+'<text x="70" y="75" text-anchor="middle" font-size="13" fill="var(--ink)">'+gbp(total)+'</text></svg><div class="leg">'+d.map(function(x){return '<span><i style="background:'+x[2]+'"></i>'+esc(x[0])+' ('+gbp(x[1])+')</span>'}).join('')+'</div>'}
function line(l,v){var m=Math.max(1,Math.max.apply(null,v)*1.15),w=400,h=170,p=v.map(function(x,i){return [i*(w-20)/(v.length-1)+10,h-24-(h-40)*x/m]}),s='';
 s+='<polyline points="'+p.map(function(a){return a.join(',')}).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>';
 p.forEach(function(a,i){s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="'+(i===v.length-1?'#ccf97c':'var(--ink)')+'" stroke="var(--ink)"><title>'+l[i]+': '+v[i]+'</title></circle><text x="'+a[0]+'" y="'+(h-6)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+l[i]+'</text>'});
 return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Site visits per week">'+s+'</svg>'}

var healthState={status:'Checking Neon database and server…',response:'—',database:'—',uptime:'—',ping:'Random-signal ping every 14 minutes while this admin tab stays open. It cannot prevent sleep after the tab closes.'};
function renderHealth(){if(cur!=='health')return;$('healthStatus').textContent=healthState.status;$('healthResponse').textContent=healthState.response;$('healthDatabase').textContent=healthState.database;$('healthUptime').textContent=healthState.uptime;$('pingStatus').textContent=healthState.ping;var max=Math.max(300,...healthSamples.map(function(s){return s.ms||0}));$('healthChart').innerHTML=healthSamples.map(function(s){return '<span class="'+(s.ok?'':'bad')+'" style="height:'+Math.max(8,Math.round((s.ms||max)/max*100))+'%" title="'+(s.ok?s.ms+' ms':'Unavailable')+'"></span>'}).join('');$('healthChart').setAttribute('aria-label',healthSamples.length?healthSamples.map(function(s){return s.ok?s.ms+' milliseconds':'unavailable'}).join(', '):'No health samples yet')}
async function checkHealth(){if(healthPending)return;healthPending=true;var started=performance.now();try{var r=await fetch('/api/admin/health',{cache:'no-store'}),data=await r.json(),ms=Math.round(performance.now()-started),ok=r.ok&&data.ok;healthSamples.push({ok:ok,ms:ms});if(healthSamples.length>12)healthSamples.shift();healthState.status=ok?'Checked '+new Date().toLocaleTimeString():'Backend or Neon database unavailable';healthState.response=ms+' ms';healthState.database=data.database?.ok?data.database.latencyMs+' ms':'Unavailable';healthState.uptime=data.server?Math.floor(data.server.uptimeSeconds/60)+' min':'—'}catch(e){healthSamples.push({ok:false,ms:0});if(healthSamples.length>12)healthSamples.shift();healthState.status='Could not reach the server';healthState.response='—';healthState.database='—';healthState.uptime='—'}healthPending=false;renderHealth()}
async function pingBackend(){try{var r=await fetch('/api/admin/ping?signal='+encodeURIComponent(crypto.randomUUID()),{cache:'no-store'});if(!r.ok)throw Error('Ping failed');healthState.ping='Last random-signal ping: '+new Date().toLocaleTimeString()+'. Next in about 14 minutes while this tab stays open.'}catch(e){healthState.ping='Ping failed at '+new Date().toLocaleTimeString()+'. The tab must stay open, and browser timers may be delayed.'}checkHealth()}
