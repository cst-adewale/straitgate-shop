<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Straitgate – Admin</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--ink:#0a0a0a;--lime:#ccf97c;--tile:#f5f5f5;--mute:#8a8a8a;--bg:#161616;--red:#e5271d;--yel:#f5c20f;--blu:#1f5fe0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:#fff;color:var(--ink);font-family:"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;padding:0;-webkit-font-smoothing:antialiased;font-size:13px;overflow-x:hidden}
a{color:inherit;text-decoration:none}button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.page{min-height:100vh;width:100%;margin:0;background:#fff;border-radius:0;padding:clamp(20px,4.5vw,64px) clamp(20px,5.8vw,72px) clamp(24px,4vw,56px)}
header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.logo{font-size:clamp(20px,2.4vw,26px);font-weight:500;letter-spacing:-.04em}
.logo small{font-size:11px;color:var(--mute);letter-spacing:0;margin-left:8px;font-weight:400}
.who{font-size:11px;color:var(--mute)}
h1{font-weight:400;font-size:clamp(44px,8vw,96px);letter-spacing:-.055em;line-height:1;margin:clamp(26px,4.5vw,56px) 0 clamp(16px,2.4vw,26px)}
h2{font-weight:400;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.03em;margin:0 0 14px}
h3{font-weight:500;font-size:13px;margin:0 0 10px}
.tabs{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;margin-bottom:clamp(18px,2.6vw,30px);scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip,.btn{border:1px solid var(--ink);background:#fff;border-radius:999px;height:34px;padding:0 clamp(14px,2vw,24px);font-size:11px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;transition:background .2s,color .2s}
.chip[aria-pressed=true],.btn.l{background:var(--lime);border-color:var(--lime)}
.btn:hover{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.l:hover{color:var(--lime)}
.btn.sm{height:28px;padding:0 12px;font-size:10px}
.btn.x{border-color:#ccc;color:#777}
.grid{display:grid;gap:clamp(12px,2vw,24px)}
.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g21{grid-template-columns:1.6fr 1fr}.gf{grid-template-columns:1fr 1.15fr}
.tile{background:var(--tile);border-radius:12px;padding:clamp(14px,1.8vw,22px);min-width:0}
.kpi .v{font-size:clamp(28px,3.4vw,44px);letter-spacing:-.05em;line-height:1;margin-top:10px;overflow-wrap:anywhere}
.kpi .l{font-size:11px;color:var(--mute)}
.kpi .d{font-size:10px;margin-top:8px}.up{color:#2e7d12}.dn{color:var(--red)}
.note{font-size:10px;color:var(--mute);margin:10px 0 0}
svg.ch{width:100%;height:auto;display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:10px;margin-top:10px}
.leg i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
label{display:block;font-size:10px;color:var(--mute);margin:0 0 5px}
input,select,textarea{width:100%;height:34px;border:1px solid #9a9a9a;border-radius:999px;padding:0 14px;font:inherit;font-size:12px;background:#fff;color:var(--ink)}
textarea{height:70px;border-radius:14px;padding:10px 14px;resize:vertical}
input[type=file]{padding:6px 14px;height:auto}
.f{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.f .w{grid-column:1/-1}
.tw{overflow-x:auto;max-width:100%;-webkit-overflow-scrolling:touch;overscroll-behavior-inline:contain}
table{width:100%;border-collapse:collapse;font-size:12px}
th{font-weight:400;color:var(--mute);font-size:10px;text-align:left;padding:8px 10px 8px 0;border-bottom:1px solid #ddd;white-space:nowrap}
td{padding:10px 10px 10px 0;border-bottom:1px solid #eee;vertical-align:middle}
td.r,th.r{text-align:right}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:10px;background:#e8e8e8}
.pill.ok{background:var(--lime)}.pill.warn{background:#ffe4a3}.pill.bad{background:#ffc9c4}
.budget-panel{margin:0 0 clamp(18px,2.6vw,30px)}
.budget-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px}
.budget-metrics div{background:var(--tile);border-radius:10px;padding:12px}
.budget-metrics b{display:block;font-size:clamp(17px,2.5vw,25px);font-weight:500;margin-top:4px;overflow-wrap:anywhere}
.budget-rate{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}.budget-rate label{margin:0}.budget-rate input{width:100px}
.health-panel{margin:0 0 clamp(18px,2.6vw,30px)}
.health-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.health-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:14px 0}
.health-metrics div{background:var(--tile);border-radius:10px;padding:12px}
.health-metrics b{display:block;font-size:19px;font-weight:500;margin-top:4px}
.health-chart{display:flex;align-items:end;gap:5px;height:75px;border-bottom:1px solid var(--mute);padding-top:8px}
.health-chart span{flex:1;min-width:5px;border-radius:3px 3px 0 0;background:var(--lime)}
.health-chart span.bad{background:var(--red)}
.thumb{width:44px;height:44px;border-radius:8px;background:#e9e9e9;object-fit:cover;display:grid;place-items:center;font-size:14px;color:#888;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.pr{display:flex;align-items:center;gap:12px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.bar input,.bar select{width:auto;min-width:150px}
.sp{margin-left:auto}
.qi{display:grid;grid-template-columns:1fr 70px 100px 28px;gap:8px;margin-bottom:8px;align-items:center}
.sum div{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}
.sum .t{border-top:1px solid var(--ink);margin-top:6px;padding-top:12px;font-size:20px;letter-spacing:-.03em}
.res{font-size:clamp(26px,3vw,36px);letter-spacing:-.04em;margin:12px 0 0}
.cv{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.calc{max-width:320px}
.disp{background:var(--ink);color:#fff;border-radius:14px;padding:14px 16px;text-align:right;font-size:30px;letter-spacing:-.03em;min-height:64px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.disp small{font-size:11px;color:#999;min-height:14px}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.keys button{height:46px;border:0;border-radius:999px;background:#fff;font-size:16px}
.keys button:hover{background:#e6e6e6}
.keys .o{background:var(--lime)}.keys .o:hover{background:var(--ink);color:var(--lime)}
.keys .z{grid-column:span 2}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--lime);padding:10px 20px;border-radius:999px;font-size:12px;opacity:0;pointer-events:none;transition:.3s;z-index:9}
.toast.on{opacity:1;transform:translate(-50%,0)}
.empty{color:var(--mute);padding:20px 0;font-size:12px}
#pa{display:none}
@media print{body{background:#fff;padding:0}.page,.toast{display:none!important}#pa{display:block;padding:0;font-size:12px;print-color-adjust:exact;-webkit-print-color-adjust:exact}#pa table{font-size:12px}}
@media (max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g21,.gf{grid-template-columns:1fr}.g3{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.g2,.g3,.f{grid-template-columns:1fr}.g4{grid-template-columns:1fr 1fr}.qi{grid-template-columns:1fr 56px 80px 28px}.sp{margin-left:0}.bar input,.bar select{min-width:0;flex:1}}
@media (max-width:620px){.health-metrics{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.budget-metrics{grid-template-columns:1fr}}
@media (max-width:620px){.page{padding:20px 14px 32px}header{align-items:flex-start}.logo small{display:block;margin:2px 0 0}.who{order:3;width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px}.theme-toggle{margin-left:auto}h1{font-size:clamp(40px,12vw,64px);margin:28px 0 18px}#tabs{margin-left:-14px;margin-right:-14px;padding:0 14px 8px;scrollbar-width:auto;scroll-snap-type:x proximity}#tabs .chip{scroll-snap-align:start}.tile{padding:16px}.tw table:has(thead){min-width:560px}.bar{align-items:stretch}.bar input,.bar select{width:100%;flex-basis:100%}.bar .btn{justify-content:center}.qi{grid-template-columns:minmax(0,1fr) 52px 72px 28px;gap:5px}.qi input{min-width:0;padding:0 7px}.toast{width:max-content;max-width:calc(100vw - 28px);text-align:center}}
@media (max-width:480px){.cv{grid-template-columns:1fr}.budget-rate{align-items:stretch}.budget-rate input{width:100%}.health-head .btn{width:100%;justify-content:center}.health-metrics{gap:8px}.health-metrics div,.budget-metrics div{padding:10px}.health-metrics b{font-size:16px}.disp{font-size:26px}.keys{gap:6px}.keys button{height:42px}.f{gap:10px}}
@media (max-width:380px){.g4{grid-template-columns:1fr}.qi{grid-template-columns:minmax(0,1fr) 46px 64px 28px}.qi input{font-size:11px}.who{font-size:10px}.who .btn{padding:0 9px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<link rel="stylesheet" href="/straitgate-theme.css">
<script src="/straitgate-theme.js"></script>
</head>
<body>
<div class="page">
<header><span class="logo">Straitgate<small>Admin</small></span><span class="who">Admin dashboard &middot; <span id="today"></span> &middot; <button id="logout" class="btn sm" type="button">Sign out</button></span><button class="theme-toggle" type="button" aria-label="Switch to dark mode" title="Dark mode">☾</button></header>
<h1 id="ttl">Dashboard</h1>
<div class="tabs" role="tablist" id="tabs"></div>
<div id="view"></div>
<footer style="margin-top:clamp(48px,8vw,100px);padding-top:20px;border-top:1px solid #ddd"><a href="straitgate-home.html">Home</a> &nbsp;·&nbsp; <a href="straitgate-catalog.html">Catalog</a></footer>
</div>
<div id="pa"></div>
<div class="toast" id="toast" role="status"></div>

<script>
var TABS=[['dashboard','Dashboard'],['products','Products'],['inventory','Inventory'],['catalog','Catalog'],['quotes','Quotations'],['budget','Budget'],['tools','Converter & calculator']];
var CATS=['Security door','Sliding gate','Pedestrian gate','Estate gate','Garden gate','Driveway gate','Accessory'];
var ITYPES=['Equipment','Machine','Tool','Product','Material'];
var DB={products:[],inv:[],quotes:[]};
var METRIC_PERIOD={traffic:'day',signups:'day'};
function metricCard(kind,title,values){var period=METRIC_PERIOD[kind];return '<div class="tile kpi"><div class="l">'+title+'</div><div class="v">'+(values?.[period]||0)+'</div><div class="d"><select data-metric-period="'+kind+'" aria-label="'+title+' date range" style="width:auto;min-width:110px"><option value="day"'+(period==='day'?' selected':'')+'>Daily</option><option value="week"'+(period==='week'?' selected':'')+'>Weekly</option><option value="month"'+(period==='month'?' selected':'')+'>Monthly</option></select></div></div>'}
var dataLoaded=false,dataIssue='';
async function refresh(){try{var r=await fetch('/api/admin/data',{cache:'no-store'}),data=await r.json();if(!r.ok)throw Error(data.error||'Could not load dashboard data');if(!Array.isArray(data.products)||!Array.isArray(data.inv)||!Array.isArray(data.quotes))throw Error('Dashboard data is incomplete');DB=data;dataLoaded=true;dataIssue='';show();return true}catch(e){dataIssue=e.message||'Could not load dashboard data';show();return false}}
async function change(kind,action,data){if(dataIssue){toast('Reconnect to the database before saving');return false}try{var r=await fetch('/api/admin/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:kind,action:action,data:data})});var result=await r.json();if(!r.ok)throw Error(result.error||'Could not save');DB=result;dataLoaded=true;show();return true}catch(e){toast(e.message);return false}}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function gbp(n){return '₦'+(Math.round(n*100)/100).toLocaleString('en-NG',{minimumFractionDigits:0,maximumFractionDigits:2})}
function toast(m){var t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(function(){t.classList.remove('on')},2200)}
function nid(a){return a.reduce(function(m,x){return Math.max(m,x.id)},0)+1}
function totals(q){var sub=q.items.reduce(function(s,i){return s+i.q*i.p},0),d=sub*(q.disc||0)/100,net=sub-d+(+q.inst||0);return{sub:sub,d:d,inst:+q.inst||0,net:net,total:net}}
var budgetPercent=20;
function updateBudget(){if(cur!=='budget')return;var accepted=DB.quotes.filter(function(q){return q.status==='Accepted'}),sales=accepted.reduce(function(sum,q){return sum+totals(q).total},0);$('budgetSales').textContent=gbp(sales);$('budgetAmount').textContent=gbp(sales*budgetPercent/100);$('budgetCount').textContent=accepted.length}
function art(t,c){var s='',i;if(t==='Security door')s='<rect x="56" y="14" width="128" height="176" rx="6" fill="#222"/><rect x="64" y="22" width="112" height="168" fill="'+c+'"/><rect x="146" y="92" width="10" height="26" rx="5" fill="#ddd"/>';else if(t==='Garden gate'){s='<path d="M50 192V84Q120 14 190 84V192" fill="none" stroke="'+c+'" stroke-width="10"/>';for(i=0;i<7;i++)s+='<rect x="'+(66+i*18)+'" y="90" width="6" height="100" fill="'+c+'"/>'}else if(t==='Driveway gate'){s='<rect x="14" y="40" width="10" height="150" fill="#222"/><rect x="34" y="52" width="160" height="14" fill="'+c+'"/><rect x="34" y="176" width="160" height="14" fill="'+c+'"/>';for(i=0;i<9;i++)s+='<rect x="'+(40+i*17)+'" y="66" width="6" height="110" fill="'+c+'"/>'}else s='<circle cx="120" cy="100" r="50" fill="'+c+'"/>';return '<svg viewBox="0 0 240 200" class="ch">'+s+'</svg>'}

/* charts */
function barChart(l,v,hi,caption){var m=Math.max(1,Math.max.apply(null,v)*1.15),w=400,h=190,bw=w/l.length,s='';
 [0,.5,1].forEach(function(f){var y=h-24-(h-40)*f;s+='<line x1="0" x2="'+w+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/>'});
 v.forEach(function(x,i){var bh=(h-40)*x/m,y=h-24-bh;s+='<rect x="'+(i*bw+bw*.18)+'" y="'+y+'" width="'+bw*.64+'" height="'+bh+'" rx="4" fill="'+(i===hi?'#ccf97c':'var(--ink)')+'"><title>'+l[i]+': '+(caption==='Revenue'?gbp(x):x)+'</title></rect><text x="'+(i*bw+bw/2)+'" y="'+(h-8)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+l[i]+'</text>'});
 return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="'+caption+' by month">'+s+'</svg>'}
function donut(d){var total=d.reduce(function(s,x){return s+x[1]},0);if(!total)return '<div class="empty">No confirmed payments recorded yet.</div>';var r=50,C=2*Math.PI*r,o=0,s='';
 d.forEach(function(x){var len=C*x[1]/total;s+='<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="'+x[2]+'" stroke-width="24" stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-o)+'" transform="rotate(-90 70 70)"><title>'+esc(x[0])+': '+gbp(x[1])+'</title></circle>';o+=len});
 return '<svg class="ch" viewBox="0 0 140 140" style="max-width:190px;margin:0 auto" role="img" aria-label="Revenue by product category">'+s+'<text x="70" y="75" text-anchor="middle" font-size="13" fill="var(--ink)">'+gbp(total)+'</text></svg><div class="leg">'+d.map(function(x){return '<span><i style="background:'+x[2]+'"></i>'+esc(x[0])+' ('+gbp(x[1])+')</span>'}).join('')+'</div>'}
function line(l,v){var m=Math.max(1,Math.max.apply(null,v)*1.15),w=400,h=170,p=v.map(function(x,i){return [i*(w-20)/(v.length-1)+10,h-24-(h-40)*x/m]}),s='';
 s+='<polyline points="'+p.map(function(a){return a.join(',')}).join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>';
 p.forEach(function(a,i){s+='<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.5" fill="'+(i===v.length-1?'#ccf97c':'var(--ink)')+'" stroke="var(--ink)"><title>'+l[i]+': '+v[i]+'</title></circle><text x="'+a[0]+'" y="'+(h-6)+'" font-size="9" text-anchor="middle" fill="var(--mute)">'+l[i]+'</text>'});
 return '<svg class="ch" viewBox="0 0 '+w+' '+h+'" role="img" aria-label="Site visits per week">'+s+'</svg>'}

/* views */
var V={};
function inventoryRows(){return DB.inv.concat(DB.products.map(function(p){return {id:p.id,product:true,name:p.name,type:'Product',sku:'',qty:p.stockQuantity,unit:'units',min:2,loc:'Catalog',cost:0}}))}
function isLowStock(i){return i.qty!==null&&i.qty<=Math.max(i.min,2)}
V.budget=function(){return '<section class="tile budget-panel" aria-label="Sales-based budget calculator"><h2>Sales-based budget</h2><p class="note">Uses accepted quotations as an estimate of sales. This is not confirmed cash received or profit.</p><div class="budget-rate"><label for="budgetPercent">Allocate from net quotation value</label><input id="budgetPercent" type="number" min="0" max="100" step="0.1" value="'+budgetPercent+'"><span>%</span></div><div class="budget-metrics"><div><span class="note">Accepted quotations</span><b id="budgetSales">₦0</b></div><div><span class="note">Budget allocation</span><b id="budgetAmount">₦0</b></div><div><span class="note">Accepted quotes counted</span><b id="budgetCount">0</b></div></div><p class="note">Budget = accepted quotation totals after discounts × allocation percentage. The percentage is a calculator setting for this open tab.</p></section>'}
V.health=function(){return '<section class="tile health-panel" aria-label="Backend health"><div class="health-head"><div><h2 style="margin-bottom:4px">Backend health</h2><span class="note" id="healthStatus">Checking Neon database and server…</span></div><button class="btn sm" id="healthRefresh" type="button">Check now</button></div><div class="health-metrics"><div><span class="note">Response time</span><b id="healthResponse">—</b></div><div><span class="note">Neon database</span><b id="healthDatabase">—</b></div><div><span class="note">Server uptime</span><b id="healthUptime">—</b></div></div><div class="note">Response time history (this open tab)</div><div class="health-chart" id="healthChart" role="img" aria-label="No health samples yet"></div><p class="note" id="pingStatus">Random-signal ping every 14 minutes while this admin tab stays open. It cannot prevent sleep after the tab closes.</p></section>'}
V.dashboard=function(){
 var qs=DB.quotes,inventory=inventoryRows(),low=inventory.filter(isLowStock).length,
 signups=DB.signupSeries||[],visitors=DB.visitorSeries||[],revenue=DB.revenueSeries||[],colours=['#0a0a0a','#f5c20f','#1f5fe0','#ccf97c','#e5271d','#96724b'];
 return '<div class="grid g3">'+
 metricCard('traffic','Unique visitors',DB.traffic)+metricCard('signups','New signups',DB.signups)+'<div class="tile kpi"><div class="l">Top product</div><div class="v">'+esc(DB.topProduct?.name||'—')+'</div><div class="d">'+(DB.topProduct?.views||0)+' views</div></div></div><div class="grid g4" style="margin-top:clamp(12px,2vw,24px)">'+
 [['Products',DB.products.length,'In database',1],['Total revenue',DB.confirmedRevenue==null?'—':gbp(DB.confirmedRevenue),DB.confirmedRevenue==null?'Payment data unavailable':'Confirmed payments only',1],['Low-stock items',low,low?'Needs restocking':'All stocked',!low]].map(function(k){return '<div class="tile kpi"><div class="l">'+k[0]+'</div><div class="v">'+k[1]+'</div><div class="d '+(k[3]?'up':'dn')+'">'+k[2]+'</div></div>'}).join('')+'</div>'+
 '<div class="grid g21" style="margin-top:clamp(12px,2vw,24px)"><div class="tile"><h3>New users by month</h3>'+barChart(signups.map(function(x){return x.label}),signups.map(function(x){return x.value}),signups.length-1,'New users')+'</div><div class="tile"><h3>Revenue by product category</h3>'+donut((DB.revenueCategories||[]).map(function(x,i){return [x.label,x.value,colours[i%colours.length]]}))+'</div></div>'+
 '<div class="grid g2" style="margin-top:clamp(12px,2vw,24px)"><div class="tile"><h3>Unique visitors by week</h3>'+line(visitors.map(function(x){return x.label}),visitors.map(function(x){return x.value}))+'</div><div class="tile"><h3>Confirmed revenue by month</h3>'+barChart(revenue.map(function(x){return x.label}),revenue.map(function(x){return x.value}),revenue.length-1,'Revenue')+'</div></div>'+

var C={cur:'0',prev:null,op:null,fresh:true};
function calc(a,b,o){return o==='+'?a+b:o==='−'?a-b:o==='×'?a*b:b===0?NaN:a/b}
function ck(k){var x=C;
 if(k==='bs'){x.cur=x.cur.length>1?x.cur.slice(0,-1):'0'}
 else if(/^[0-9]$/.test(k)){x.cur=(x.fresh||x.cur==='0')?k:x.cur+k;x.fresh=false}
 else if(k==='.'){if(x.fresh){x.cur='0.';x.fresh=false}else if(x.cur.indexOf('.')<0)x.cur+='.'}
 else if(k==='C'){x.cur='0';x.prev=null;x.op=null;x.fresh=true}
 else if(k==='±'){x.cur=x.cur[0]==='-'?x.cur.slice(1):(x.cur==='0'?'0':'-'+x.cur)}
 else if(k==='%'){x.cur=fmt(parseFloat(x.cur)/100)}
 else if(k==='='){if(x.op!==null){var r=calc(x.prev,parseFloat(x.cur),x.op);$('cs').textContent=fmt(x.prev)+' '+x.op+' '+x.cur+' =';x.cur=isNaN(r)?'Error':fmt(r);x.prev=null;x.op=null;x.fresh=true}}
 else{if(x.op!==null&&!x.fresh){var r2=calc(x.prev,parseFloat(x.cur),x.op);x.prev=r2;x.cur=isNaN(r2)?'Error':fmt(r2)}else x.prev=parseFloat(x.cur)||0;x.op=k;x.fresh=true;$('cs').textContent=fmt(x.prev)+' '+k}

 $('cd').textContent=x.cur}

var healthSamples=[],healthPending=false;
var healthState={status:'Checking Neon database and server…',response:'—',database:'—',uptime:'—',ping:'Random-signal ping every 14 minutes while this admin tab stays open. It cannot prevent sleep after the tab closes.'};
function renderHealth(){if(cur!=='health')return;$('healthStatus').textContent=healthState.status;$('healthResponse').textContent=healthState.response;$('healthDatabase').textContent=healthState.database;$('healthUptime').textContent=healthState.uptime;$('pingStatus').textContent=healthState.ping;var max=Math.max(300,...healthSamples.map(function(s){return s.ms||0}));$('healthChart').innerHTML=healthSamples.map(function(s){return '<span class="'+(s.ok?'':'bad')+'" style="height:'+Math.max(8,Math.round((s.ms||max)/max*100))+'%" title="'+(s.ok?s.ms+' ms':'Unavailable')+'"></span>'}).join('');$('healthChart').setAttribute('aria-label',healthSamples.length?healthSamples.map(function(s){return s.ok?s.ms+' milliseconds':'unavailable'}).join(', '):'No health samples yet')}
async function checkHealth(){if(healthPending)return;healthPending=true;var started=performance.now();try{var r=await fetch('/api/admin/health',{cache:'no-store'}),data=await r.json(),ms=Math.round(performance.now()-started),ok=r.ok&&data.ok;healthSamples.push({ok:ok,ms:ms});if(healthSamples.length>12)healthSamples.shift();healthState.status=ok?'Checked '+new Date().toLocaleTimeString():'Backend or Neon database unavailable';healthState.response=ms+' ms';healthState.database=data.database?.ok?data.database.latencyMs+' ms':'Unavailable';healthState.uptime=data.server?Math.floor(data.server.uptimeSeconds/60)+' min':'—'}catch(e){healthSamples.push({ok:false,ms:0});if(healthSamples.length>12)healthSamples.shift();healthState.status='Could not reach the server';healthState.response='—';healthState.database='—';healthState.uptime='—'}healthPending=false;renderHealth()}
async function pingBackend(){try{var r=await fetch('/api/admin/ping?signal='+encodeURIComponent(crypto.randomUUID()),{cache:'no-store'});if(!r.ok)throw Error('Ping failed');healthState.ping='Last random-signal ping: '+new Date().toLocaleTimeString()+'. Next in about 14 minutes while this tab stays open.'}catch(e){healthState.ping='Ping failed at '+new Date().toLocaleTimeString()+'. The tab must stay open, and browser timers may be delayed.'}checkHealth()}
